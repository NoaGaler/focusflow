# Builds the server and client images (linux/amd64) and pushes them to Docker Hub
# on every push to main. Needs two repository secrets (Settings -> Secrets -> Actions):
#   DOCKERHUB_USERNAME  - the Docker Hub user name
#   DOCKERHUB_TOKEN     - a Docker Hub access token (not the password)
name: Build & push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r server/requirements.txt pytest httpx
      - run: cd server && MONGODB_URI=mongodb://localhost:27017 python -m pytest -q tests

  build:
    needs: test-server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          provenance: false   # plain single-image manifest (simplest for Cloud Run and registry mirrors)
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/focusflow-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/focusflow-${{ matrix.service }}:${{ github.sha }}

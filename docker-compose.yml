# FocusFlow - the whole system with one command:  docker compose up
#   Client: http://localhost:3000        Server health: http://localhost:8000/health
#   API docs: http://localhost:8000/api/docs
#
# The images are public on Docker Hub (built for linux/amd64 by GitHub Actions).
# Developers can rebuild from source with:  docker compose up --build

name: focusflow

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db          # data survives restarts
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ${DOCKERHUB_USER:-noagaler}/focusflow-server:latest
    build: ./server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # works even before you create .env
    environment:
      # Inside Docker the database host is the service name "mongo", not localhost.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-focusflow}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"

  client:
    image: ${DOCKERHUB_USER:-noagaler}/focusflow-client:latest
    build: ./client
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://server:8000   # nginx forwards /api to the server container
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  mongo-data:
